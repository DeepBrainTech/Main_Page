name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/main_page
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/main_page/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:e2e:prepare
      - name: Package the production app for browser tests
        run: tar -czf "$RUNNER_TEMP/frontend-build.tgz" -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-build.tgz
          retention-days: 1
          if-no-files-found: error

  backend-tests:
    name: Backend business tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/api
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: sqlite:///ci-bootstrap-unused.db
      SECRET_KEY: ci-only-secret-not-for-production
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.txt
            backend/api/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-smoke:
    name: Browser navigation smoke tests
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/main_page
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/main_page/package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-build
      - name: Restore the tested production app
        run: |
          mkdir -p .next/standalone
          tar -xzf "$RUNNER_TEMP/frontend-build/frontend-build.tgz" -C .next/standalone
      - name: Install PR browsers
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium
      - name: Install nightly browsers
        if: github.event_name == 'schedule'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run desktop and mobile navigation tests
        if: github.event_name != 'schedule'
        run: npm run test:e2e
      - name: Run nightly cross-browser navigation tests
        if: github.event_name == 'schedule'
        run: npm run test:e2e:all
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results
          path: |
            frontend/main_page/playwright-report/
            frontend/main_page/test-results/
          retention-days: 7
