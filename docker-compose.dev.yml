services:
  # PostgreSQL 数据库（开发环境）
  postgres:
    image: postgres:16-alpine
    container_name: main-page-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=main_page_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - main-page-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端服务（开发模式 - 支持热重载）
  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: main-page-api-dev
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/main_page_db
      - SECRET_KEY=dev-secret-key-change-in-production-please
      # ===== Cross-subdomain auth cookie =====
      # Local dev: host-only cookie on localhost, no HTTPS requirement.
      # In production set ACCESS_TOKEN_COOKIE_DOMAIN=.deepbraintechnology.com
      # and ACCESS_TOKEN_COOKIE_SECURE=true.
      - ACCESS_TOKEN_COOKIE_NAME=access_token
      - ACCESS_TOKEN_COOKIE_DOMAIN=
      - ACCESS_TOKEN_COOKIE_SAMESITE=lax
      - ACCESS_TOKEN_COOKIE_SECURE=false
      # FogChess 短期令牌配置
      - FOG_CHESS_JWT_SECRET=dev-fog
      - FOG_CHESS_JWT_AUD=fogchess
      - FOG_CHESS_JWT_ISS=main-portal
      - FOG_CHESS_TOKEN_EXPIRE_SECONDS=300
      # Stripe (optional). Set keys + price ids to enable Checkout on /membership.
      # - STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
      # - STRIPE_PRICE_PLUS_MONTHLY, STRIPE_PRICE_PLUS_ANNUAL, STRIPE_PRICE_PREMIUM_MONTHLY, STRIPE_PRICE_PREMIUM_ANNUAL
      # - PUBLIC_APP_URL=https://your-frontend-origin (e.g. http://localhost:3000)
      # Enable Customer Portal once in Stripe Dashboard → Billing → Customer portal.
    volumes:
      # 开发模式：挂载代码目录以便热重载
      - ./backend/api:/app
      - /app/venv
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main-page-network-dev

  # Next.js 前端服务（开发模式 - 支持热重载）
  frontend:
    image: node:20-alpine
    container_name: main-page-frontend-dev
    working_dir: /app
    # Load frontend/main_page/.env into the container process (Compose does not read this path for ${VAR} substitution).
    env_file:
      - ./frontend/main_page/.env
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # 与代码一致的 API 变量名
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # FogChess 前端入口（本地或指向线上）
      - NEXT_PUBLIC_FOGCHESS_URL=http://localhost:8080
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    volumes:
      # 开发模式：挂载代码目录以便热重载
      - ./frontend/main_page:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - main-page-network-dev

networks:
  main-page-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:

